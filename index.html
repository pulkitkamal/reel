<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Reel 8 Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a hand-held cine camera seen from the back.
   Brushed aluminium top plate with recessed readout windows, the viewfinder in the middle,
   a ribbed black grip at the bottom with one red trigger. Single theme by choice. */
:root{
  color-scheme: dark;
  --alu:#cdcac2;        /* top plate */
  --alu-shade:#a19e96;  /* plate edge and engraving shadow */
  --ink:#161514;        /* engraved lettering, recessed windows */
  --body:#17181a;       /* grip */
  --body-hi:#2b2d30;    /* raised parts on the grip */
  --trigger:#e2472b;    /* record */
  --lamp:#ffb648;       /* readouts */
  --paper:#efeee9;      /* light text on dark */
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#0b0b0c;color:var(--paper);font-family:var(--mono);font-size:13px;
  display:flex;justify-content:center;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
[hidden]{display:none !important}

#cam{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;
  background:var(--body);overflow:hidden}

/* ---------- top plate ---------- */
.plate{flex:none;display:flex;gap:10px;align-items:flex-end;padding:10px 14px 12px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.05) 1px 2px,transparent 2px 4px),
    linear-gradient(180deg,#dcd9d2,var(--alu) 45%,#b9b6ae);
  border-bottom:2px solid var(--alu-shade);box-shadow:0 2px 0 rgba(0,0,0,.6)}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl.grow{flex:1}
.eng{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.16em;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.55);padding-left:2px}
.win{height:44px;border-radius:7px;background:var(--ink);color:var(--lamp);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;gap:2px;font-weight:600}
button.win{padding:0 14px;min-width:68px;font-size:16px}
button.win:active,.win button:active{filter:brightness(1.5)}
button.win:disabled{opacity:.45}
.win small{font-size:9px;font-weight:400;margin-left:4px;opacity:.8}
.expo{justify-content:space-between;padding:0 2px}
.expo button{width:40px;height:44px;display:grid;place-items:center;font-size:20px;color:var(--lamp)}
.expo #evVal{flex:1;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.expo .sep{width:1px;height:22px;background:#4a4640}
#lockBtn svg{width:19px;height:19px}
#lockBtn[aria-pressed="true"]{color:var(--trigger)}

/* stock drawer */
.drawer{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 14px;background:#0f0f10;border-bottom:1px solid #000}
.drow{display:flex;gap:6px}
.drawer button{flex:1;height:40px;border-radius:6px;background:var(--body-hi);font-weight:600;color:var(--paper);font-size:12px}
.drawer button:disabled{opacity:.45}
#formatRow button{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.drawer button[aria-pressed="true"]{background:var(--lamp);color:var(--ink)}

/* ---------- viewfinder ---------- */
.finder{position:relative;flex:1;min-height:0;background:#000}
#view{width:100%;height:100%;display:block;object-fit:contain}
.rec{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;
  background:rgba(0,0,0,.6);font-weight:600;font-variant-numeric:tabular-nums}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--trigger);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.chip{position:absolute;top:12px;left:12px;height:36px;padding:0 12px;border-radius:6px;background:rgba(0,0,0,.6);
  color:var(--paper);font-size:12px}
.zoomRead{position:absolute;bottom:12px;right:12px;padding:5px 9px;border-radius:6px;background:rgba(0,0,0,.6);
  font-variant-numeric:tabular-nums;transition:opacity .3s}
.zoomRead.off{opacity:0}
.card{position:absolute;left:14px;right:14px;bottom:14px;padding:14px;border-radius:10px;
  background:rgba(14,14,15,.9);border:1px solid #3a3b3e;display:flex;flex-direction:column;gap:12px}
.card p{margin:0;line-height:1.5;font-size:12px;color:var(--paper)}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .row button,.card .row label{flex:1 1 130px;height:44px;border-radius:7px;display:grid;place-items:center;
  font-weight:600;font-size:12px;cursor:pointer;text-align:center}
.primary{background:var(--lamp);color:var(--ink)}
.second{background:var(--body-hi);color:var(--paper)}
.card .x{position:absolute;top:4px;right:4px;width:36px;height:36px;font-size:18px;color:#9a9a9a}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:82%;padding:10px 14px;border-radius:8px;
  background:rgba(0,0,0,.82);text-align:center;line-height:1.45;pointer-events:none;transition:opacity .25s}
.toast.off{opacity:0}

/* ---------- grip ---------- */
.grip{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 20px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),
    linear-gradient(180deg,#232427,var(--body));
  border-top:2px solid #000}
.round{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b3d41,#1b1c1e 70%);
  box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.12);display:grid;place-items:center;color:var(--paper)}
.round:active{transform:translateY(1px)}
.round svg{width:24px;height:24px}
.round .n{position:absolute;margin:-34px 0 0 34px;min-width:18px;height:18px;border-radius:9px;background:var(--lamp);
  color:var(--ink);font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.trigger{width:92px;height:92px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#e9e6df,var(--alu-shade) 75%);
  box-shadow:0 3px 0 #000,inset 0 0 0 3px rgba(0,0,0,.25);display:grid;place-items:center}
.trigger b{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff7a5c,var(--trigger) 60%,#a82a14);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.35);transition:border-radius .15s,width .15s,height .15s}
.trigger:active b{filter:brightness(.85)}
.trigger[aria-pressed="true"] b{width:34px;height:34px;border-radius:7px}
.rocker{display:flex;height:54px;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#dcd9d2,#b0ada5);box-shadow:0 2px 0 #000}
.rocker button{width:52px;font-family:var(--display);font-weight:800;font-size:24px;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.5);touch-action:none}
.rocker button+button{border-left:2px solid var(--alu-shade)}
.rocker button:active{background:rgba(0,0,0,.18)}

/* ---------- sheets ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#101011;border-top:2px solid var(--alu-shade);
  border-radius:16px 16px 0 0;padding:14px 18px 22px;display:flex;flex-direction:column;gap:16px;max-height:92%;overflow-y:auto}
.sheet.full{top:0;border-radius:0;border-top:0;max-height:none}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.08em}
.head{display:flex;align-items:center;justify-content:space-between}
.head button{width:44px;height:44px;border-radius:50%;background:var(--body-hi);font-size:20px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.field>span,.field>label{font-size:13px}
.field output{color:var(--lamp);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;padding:4px;border-radius:9px;background:#1d1e20}
.seg button{flex:1;min-width:64px;height:38px;border-radius:6px;color:#b9b8b3}
.seg button[aria-pressed="true"]{background:var(--lamp);color:var(--ink);font-weight:600}
.seg.dim{opacity:.4}
.switch{width:56px;height:32px;border-radius:16px;background:#3a3b3e;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--paper);transition:left .15s}
.switch[aria-checked="true"]{background:var(--lamp)}
.switch[aria-checked="true"]::after{left:27px}
.switch:disabled{opacity:.4}
.slide{display:flex;flex-direction:column;gap:8px}
input[type=range]{width:100%;height:32px;margin:0;accent-color:var(--lamp);background:transparent}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.clip{background:#1d1e20;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.clip video{width:100%;aspect-ratio:3/4;object-fit:contain;background:#000;display:block}
.clip .meta{padding:8px;font-size:11px;color:#b9b8b3}
.clip .row{display:flex;gap:6px;padding:0 8px 8px}
.clip .row button{flex:1;height:40px;border-radius:6px;font-size:12px;font-weight:600}
.note{margin:0;font-size:12px;line-height:1.5;color:#b9b8b3}
.srcvid{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
@supports (height:100dvh){html,body{height:100dvh}}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}*{transition:none !important}}
@media (max-height:620px){.grip{padding:10px 16px 12px}.trigger{width:76px;height:76px}.trigger b{width:54px;height:54px}}
@media (orientation:landscape) and (max-height:540px){
  #cam{max-width:none;flex-direction:row}
  .plate{flex-direction:column;align-items:stretch;justify-content:center;gap:10px;width:140px;padding:8px 10px;
    border-bottom:0;border-right:2px solid var(--alu-shade);box-shadow:2px 0 0 rgba(0,0,0,.6)}
  .ctl.grow{flex:none}
  .expo{display:grid;grid-template-columns:1fr 1fr 1fr;height:auto;padding:0 2px}
  .expo #lockBtn{grid-column:1/4;width:100%;height:34px;border-bottom:1px solid #4a4640}
  .expo .sep{display:none}
  .expo button{width:100%;height:40px}
  .expo #evVal{align-self:center;font-size:14px}
  .drawer{position:absolute;left:140px;top:0;z-index:4;width:min(380px,calc(100% - 280px));border-radius:0 0 10px 0;border-right:1px solid #000}
  .finder{min-width:0}
  .grip{display:grid;grid-template-columns:1fr 1fr;align-content:center;justify-items:center;gap:12px 8px;width:140px;padding:8px 10px;
    border-top:0;border-left:2px solid #000}
  .grip .trigger,.grip .rocker{grid-column:1/3}
  .trigger{width:76px;height:76px}.trigger b{width:54px;height:54px}
  .sheet{left:140px;right:140px}
  .sheet.full{left:0;right:0}
}
</style>
</head>
<body>
<div id="cam">

  <header class="plate">
    <div class="ctl">
      <span class="eng" id="formatEng">SUPER 8</span>
      <button class="win" id="stockBtn" aria-expanded="false" aria-controls="stockDrawer">200T</button>
    </div>
    <div class="ctl grow">
      <span class="eng">EXPOSURE</span>
      <div class="win expo">
        <button id="lockBtn" aria-pressed="false" aria-label="Lock exposure"></button>
        <span class="sep"></span>
        <button id="evDown" aria-label="Darker">&minus;</button>
        <span id="evVal">0.0</span>
        <button id="evUp" aria-label="Brighter">+</button>
      </div>
    </div>
    <div class="ctl">
      <span class="eng">SPEED</span>
      <button class="win" id="fpsBtn" aria-label="Frames per second">18<small>FPS</small></button>
    </div>
  </header>

  <div class="drawer" id="stockDrawer" hidden>
    <div class="drow" id="formatRow" role="group" aria-label="Format"><button data-v="s8">Super 8</button><button data-v="s16">Super 16</button><button data-v="vhs">VHS</button></div>
    <div class="drow" id="stockRow" role="group" aria-label="Film or tape"></div>
  </div>

  <main class="finder" id="finder">
    <canvas id="view" width="1080" height="1440"></canvas>
    <button class="chip" id="srcChip" hidden>Change clip</button>
    <div class="rec" id="recLamp" hidden><i></i><span id="recTime">00:00</span></div>
    <div class="zoomRead off" id="zoomRead">1.0&times;</div>
    <div class="card" id="srcCard" hidden>
      <button class="x" id="cardClose" aria-label="Close" hidden>&times;</button>
      <p id="cardText"></p>
      <div class="row">
        <label class="primary" for="shootInput">Shoot a clip</label>
        <label class="second" for="pickInput">Choose a clip</label>
        <button class="second" id="liveBtn" hidden>Try live camera</button>
      </div>
    </div>
    <div class="toast off" id="toast" role="status"></div>
  </main>

  <footer class="grip">
    <button class="round" id="galleryBtn" aria-label="Open clips">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/><path d="M8 11.5v4l3.5-2z" fill="currentColor"/></svg>
      <span class="n" id="clipCount" hidden>0</span>
    </button>
    <button class="round" id="settingsBtn" aria-label="Open settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
    </button>
    <button class="trigger" id="trigger" aria-pressed="false" aria-label="Start recording"><b></b></button>
    <div class="rocker" role="group" aria-label="Zoom">
      <button id="zoomW" aria-label="Zoom out">W</button>
      <button id="zoomT" aria-label="Zoom in">T</button>
    </div>
  </footer>

  <section class="sheet" id="settings" hidden aria-label="Settings">
    <div class="head"><h2>SETTINGS</h2><button id="settingsClose" aria-label="Close settings">&times;</button></div>
    <div class="field"><span>Camera</span>
      <div class="seg" id="facingSeg"><button data-v="environment">Rear</button><button data-v="user">Front</button></div>
    </div>
    <div class="field"><span id="overLabel">Overscan (show film edge)</span>
      <button class="switch" id="overSwitch" role="switch" aria-checked="false" aria-labelledby="overLabel"></button>
    </div>
    <div class="seg dim" id="sideSeg"><button data-v="2">Top</button><button data-v="3">Bottom</button><button data-v="0">Left</button><button data-v="1">Right</button></div>
    <div class="field"><span id="burnLabel">Film burn at start of shot</span>
      <button class="switch" id="burnSwitch" role="switch" aria-checked="true" aria-labelledby="burnLabel"></button>
    </div>
    <p class="note" id="filmOnlyNote" hidden>Overscan and film burn are for film only. They are off for VHS.</p>
    <div class="slide">
      <div class="field"><label for="filterRange">Color filter</label><output id="filterOut" for="filterRange">None</output></div>
      <input type="range" id="filterRange" min="0" max="8" step="1" value="4">
    </div>
    <div class="slide">
      <div class="field"><label for="speedRange">W/T zoom speed</label><output id="speedOut" for="speedRange">1.0&times;</output></div>
      <input type="range" id="speedRange" min="0.4" max="2" step="0.1" value="1">
    </div>
  </section>

  <section class="sheet full" id="gallery" hidden aria-label="Clips">
    <div class="head"><h2>CLIPS</h2><button id="galleryClose" aria-label="Close clips">&times;</button></div>
    <p class="note" id="galleryNote">No clips yet. Press the red button to record one.</p>
    <div class="clips" id="clips"></div>
  </section>

  <input type="file" id="shootInput" accept="video/*" capture="environment" hidden>
  <input type="file" id="pickInput" accept="video/*" hidden>
  <video id="srcVideo" class="srcvid" playsinline muted></video>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const FRAMED = window.self!==window.top;

/* ---------- formats, stocks, filters ---------- */
// k = contrast of the film curve, black/white = colour of the deepest shadow and brightest highlight,
// grain = strength, hal = red glow around highlights, dust = 1 dark specks (reversal), -1 light specks (negative)
const FILM_STOCKS={
  "50D": {wb:[1.02,1.00,0.97],sat:1.15,k:5.0,gain:1.09,off:0,gam:[1,1,1],sh:1.2,kc:[1,.97,.9],hd:.35,black:[.036,.030,.030],white:[.945,.935,.895],grain:.32,hal:3.0,bloom:.10,bw:0,dust:1},
  "100D":{wb:[1.05,1.00,0.93],sat:1.25,k:5.8,gain:1.09,off:0,gam:[1,1,1],sh:1.2,kc:[1,.97,.9],hd:.35,black:[.030,.024,.026],white:[.950,.925,.870],grain:.37,hal:3.2,bloom:.08,bw:0,dust:1},
  // 200T and 500T: curve fitted point by point to a reference 500T clip of the same scene
  "200T":{wb:[0.78,1.00,1.58],sat:1.10,k:3.56,gain:1.093,off:.15,gam:[.63,.71,.87],sh:.3,kc:[1,1,1],hd:.5,black:[.012,.010,.036],white:[.955,.932,.830],grain:.48,hal:4.6,bloom:.12,bw:0,dust:1},
  "500T":{wb:[0.75,1.00,1.70],sat:1.10,k:3.56,gain:1.093,off:.16,gam:[.61,.70,.87],sh:.3,kc:[1,1,1],hd:.5,black:[.012,.010,.041],white:[.955,.930,.820],grain:.56,hal:5.5,bloom:.15,bw:0,dust:1},
  "B&W": {wb:[1.00,1.00,1.00],sat:0.00,k:5.6,gain:1.09,off:0,gam:[1,1,1],sh:1.2,kc:[1,1,1],hd:0,black:[.028,.028,.028],white:[.940,.940,.940],grain:.53,hal:3.0,bloom:.10,bw:1,dust:1}
};
const TAPES={
  "SP":  {soft:1.0,noise:.050,wear:0.00,sat:.92},
  "EP":  {soft:1.5,noise:.085,wear:0.22,sat:.84},
  "WORN":{soft:1.7,noise:.120,wear:1.00,sat:.76}
};
const FORMATS={
  s8: {name:"SUPER 8", aspect:4/3,fps:[18,24],stocks:Object.keys(FILM_STOCKS),pShort:520,gs:1.1,grainMul:1.0, weave:1.0, vig:.58,vexp:.55,ca:.0035,corner:.034,strip:.15,edge:.036,soft:.36,halo:1.1,dsz:1.0,dmg:1.0},
  s16:{name:"SUPER 16",aspect:5/3,fps:[24,25],stocks:Object.keys(FILM_STOCKS),pShort:880,gs:.9,grainMul:.6,weave:.32,vig:.24,vexp:1.25,ca:.0014,corner:.012,strip:.13,edge:.030,soft:.55,halo:1.0,dsz:.65,dmg:.6},
  vhs:{name:"VHS",     aspect:4/3,fps:[25,30],stocks:Object.keys(TAPES),      pShort:480}
};
const FILTERS=[
  ["85B Warm",[1.22,1.00,0.72]],["85 Warm",[1.18,1.00,0.76]],["81EF Warm",[1.11,1.00,0.86]],["81A Warm",[1.05,1.00,0.93]],
  ["None",[1,1,1]],
  ["82A Cool",[0.95,1.00,1.06]],["82B Cool",[0.91,1.00,1.11]],["80B Cool",[0.80,1.00,1.22]],["80A Cool",[0.74,1.00,1.30]]
];

/* ---------- state ---------- */
const S={format:"s8",stockBy:{s8:"200T",s16:"200T",vhs:"SP"},fpsBy:{s8:18,s16:24,vhs:25},ev:0,lock:false,
  facing:"environment",overscan:false,side:0,filter:4,zoomSpeed:1,zoom:1,burn:false};
Object.defineProperty(S,"stock",{get(){return S.stockBy[S.format];}});
Object.defineProperty(S,"fps",{get(){return S.fpsBy[S.format];}});
let mode="test";            // "test" | "live" | "clip" | "still" (still is for testing only)
let recording=false,stillEl=null;
try{
  const saved=JSON.parse(localStorage.getItem("reel8v2")||"{}");
  if(FORMATS[saved.format]) S.format=saved.format;
  for(const f in FORMATS){
    if(saved.stockBy&&FORMATS[f].stocks.includes(saved.stockBy[f])) S.stockBy[f]=saved.stockBy[f];
    if(saved.fpsBy&&FORMATS[f].fps.includes(saved.fpsBy[f])) S.fpsBy[f]=saved.fpsBy[f];
  }
  if(saved.facing==="user") S.facing="user";
  S.overscan=!!saved.overscan;
  if([0,1,2,3].includes(saved.side)) S.side=saved.side;
  if(saved.filter>=0&&saved.filter<FILTERS.length) S.filter=saved.filter|0;
  if(saved.zoomSpeed) S.zoomSpeed=Math.min(2,Math.max(.4,+saved.zoomSpeed||1));
  if(saved.burnOn===true) S.burn=true;
}catch(e){}
function remember(){
  try{localStorage.setItem("reel8v2",JSON.stringify({format:S.format,stockBy:S.stockBy,fpsBy:S.fpsBy,facing:S.facing,

/* ---------- test scene (shown until a camera or clip is ready) ---------- */
const testCv=document.createElement("canvas");testCv.width=540;testCv.height=720;
const tctx=testCv.getContext("2d");
function drawTest(t){
  const w=540,h=720,c=tctx;
  let g=c.createLinearGradient(0,0,0,h*.62);
  g.addColorStop(0,"#3f6fb0");g.addColorStop(.6,"#f0b27a");g.addColorStop(1,"#ffe2a8");
  c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle="#fff6d8";c.beginPath();c.arc(380,300+Math.sin(t*.2)*6,46,0,7);c.fill();
  c.fillStyle="rgba(255,255,255,.75)";
  for(let i=0;i<4;i++){const x=((i*190+t*14)%(w+200))-100,y=90+i*38;c.beginPath();c.ellipse(x,y,70,16,0,0,7);c.ellipse(x+40,y-10,44,16,0,0,7);c.fill();}
  const layers=[["#7d8fa6",.62,10,.006,36],["#4f6b62",.70,22,.010,30],["#2f4a3a",.80,44,.016,24]];
  for(const [col,base,spd,f,amp] of layers){
    c.fillStyle=col;c.beginPath();c.moveTo(0,h);
    for(let x=0;x<=w;x+=6){const u=x+t*spd;c.lineTo(x,h*base-Math.sin(u*f)*amp-Math.sin(u*f*2.7+1)*amp*.4);}
    c.lineTo(w,h);c.fill();
  }
  c.fillStyle="#1d2f24";c.fillRect(0,h*.9,w,h*.1);
  c.fillStyle="#c9372c";
  const bx=((t*70)%(w+120))-60;c.fillRect(bx,h*.865,54,22);c.fillRect(bx+10,h*.848,30,18);
  c.fillStyle="#111";c.beginPath();c.arc(bx+12,h*.9,8,0,7);c.arc(bx+42,h*.9,8,0,7);c.fill();
}

const FS_VHS=COMMON+`uniform sampler2D uP,uNoise;

let glOK=false,PR={},srcTex=null,noiseTex=null,dustTex=null,T={};
function makeProg(fsSrc){
  const mk=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}return s;};
  const vs=mk(gl.VERTEX_SHADER,VS),fs=mk(gl.FRAGMENT_SHADER,fsSrc);
  if(!vs||!fs) return null;

  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));return null;}

}
function use(pr,vals){
  gl.useProgram(pr.p);

    let l=pr.loc[n];if(l===undefined) l=pr.loc[n]=gl.getUniformLocation(pr.p,n);
    if(l===null) continue;

    else if(v.tex!==undefined) gl.uniform1i(l,v.tex);
    else if(v instanceof Float32Array) gl.uniform4fv(l,v);
    else if(v.length===2) gl.uniform2f(l,v[0],v[1]);

function makeTex(repeat){

  t.w=w;t.h=h;

function draw(t){

function bind(unit,tex){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);}
function makeNoise(){
  // soft-edged random clumps, so grain looks like grain and not like square pixels
  const n=256,raw=new Float32Array(n*n*3),out=new Uint8Array(n*n*4);
  for(let i=0;i<raw.length;i++){let s=0;for(let k=0;k<4;k++)s+=Math.random();raw[i]=(s-2)/1.155;}
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)for(let c=0;c<3;c++){
    let s=0;

      const w=(i===0&&j===0)?.4:(i===0||j===0)?.11:.04;
      s+=raw[(((y+j+n)%n)*n+((x+i+n)%n))*3+c]*w;

  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,n,n,0,gl.RGBA,gl.UNSIGNED_BYTE,out);

let liveStream=null,clipUrl=null;

    try{s=await navigator.mediaDevices.getUserMedia({video:want.video});}

  }

  video.removeAttribute("src");video.srcObject=s;video.muted=true;video.loop=false;

}
function loadClip(file){

/* ---------- recording ---------- */
let rec=null,chunks=[],recStart=0,recTimer=0,actx=null,adest=null,recTrack=null;
const clips=[];
function pickMime(){

function clipAudioTrack(){
  try{

  }catch(e){return null;}
}

    let done=false;const fin=()=>{if(!done){done=true;res();}};
    setTimeout(fin,1500);
    if(video.requestVideoFrameCallback){
      const cb=(n,meta)=>{if(done) return;if(!video.seeking&&meta.mediaTime<.5) fin(); else video.requestVideoFrameCallback(cb);};
      video.requestVideoFrameCallback(cb);
    }else{

let starting=false;

}
async function beginRec(){

/* ---------- saving ---------- */
let dlPromise=null;
function getDownloads(){
  if(!(window.claude&&window.claude.use)) return Promise.resolve(undefined);
  if(!dlPromise) dlPromise=window.claude.use("downloads").catch(()=>null);
  return dlPromise;
}
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function saveOutsideClaude(c,btn,filename){
  // On an iPhone or iPad the share sheet is the way into Photos ("Save Video"); elsewhere a normal download
  const link=()=>{const a=document.createElement("a");a.href=c.url;a.download=filename;document.body.appendChild(a);a.click();a.remove();btn.textContent="Saved";};
  if(IS_IOS&&navigator.canShare){
    let file=null;
    try{file=new File([c.blob],filename,{type:c.ext==="mp4"?"video/mp4":"video/webm"});}catch(e){}
    if(file&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(()=>{btn.textContent="Done";}).catch(e=>{if(!e||e.name!=="AbortError") link();});
      return;
    }
  }
  link();
}
async function saveClip(c,btn){
  const filename=c.name+"."+c.ext;
  if(!(window.claude&&window.claude.use)){saveOutsideClaude(c,btn,filename);return;}   // must run straight from the tap
  btn.disabled=true;
  try{
    const dl=await getDownloads();
    if(dl){
      try{await dl.save({filename,data:c.blob});btn.textContent="Saved";}
      catch(e){
        const code=e&&e.code;
        if(code==="declined") toast("Not saved.");
        else if(code==="too_large") toast("This clip is too big to save here. Record a shorter one.",3600);
        else if(code==="rate_limited") toast("Wait a moment, then press Save again.");
        else toast("Saving did not work in this view.",3600);
      }
    }else toast("Saving is not available in this view.",3600);
  }finally{btn.disabled=false;}
}
function renderClips(){
  const box=$("clips");box.textContent="";
  for(const c of clips){
    const el=document.createElement("div");el.className="clip";
    const v=document.createElement("video");v.src=c.url;v.controls=true;v.playsInline=true;v.preload="metadata";
    v.style.aspectRatio=String(c.aspect);
    const meta=document.createElement("div");meta.className="meta";meta.textContent=c.label+" · "+c.fps+" fps · "+c.secs+" s";
    const row=document.createElement("div");row.className="row";
    const sv=document.createElement("button");sv.className="primary";sv.textContent="Save";sv.onclick=()=>saveClip(c,sv);
    const del=document.createElement("button");del.className="second";del.textContent="Delete";
    del.onclick=()=>{const i=clips.indexOf(c);if(i>=0){clips.splice(i,1);URL.revokeObjectURL(c.url);renderClips();}};
    row.append(sv,del);el.append(v,meta,row);box.append(el);
  }
  $("galleryNote").textContent=clips.length
    ?"Clips stay here only while this page is open. Save the ones you want to keep."
    :"No clips yet. Press the red button to record one.";
  $("clipCount").hidden=!clips.length;$("clipCount").textContent=clips.length;
}

  $("burnSwitch").setAttribute("aria-checked",S.burn&&!isVhs);
  $("filmOnlyNote").hidden=!isVhs;
  $("filterRange").value=S.filter;$("filterOut").textContent=FILTERS[S.filter][0];
  $("speedRange").value=S.zoomSpeed;$("speedOut").textContent=S.zoomSpeed.toFixed(1)+"×";
}
function closeDrawer(){$("stockDrawer").hidden=true;$("stockBtn").setAttribute("aria-expanded","false");}
$("stockBtn").onclick=()=>{const d=$("stockDrawer");d.hidden=!d.hidden;$("stockBtn").setAttribute("aria-expanded",String(!d.hidden));};
$("formatRow").onclick=e=>{
  const v=e.target.dataset&&e.target.dataset.v;if(!v||!FORMATS[v]||recording||v===S.format) return;
  S.format=v;remember();buildStocks();paint();
};
$("evDown").onclick=()=>{S.ev=Math.max(-3,Math.round((S.ev-.5)*2)/2);paint();};
$("evUp").onclick=()=>{S.ev=Math.min(3,Math.round((S.ev+.5)*2)/2);paint();};
$("fpsBtn").onclick=()=>{
  if(recording) return;
  const o=FORMATS[S.format].fps;S.fpsBy[S.format]=o[(o.indexOf(S.fps)+1)%o.length];remember();paint();
};
$("lockBtn").onclick=async()=>{
  const tr=mode==="live"&&liveStream&&liveStream.getVideoTracks()[0];
  if(!tr){toast("Exposure lock works with the live camera only.");return;}
  const caps=tr.getCapabilities?tr.getCapabilities():{};
  if(!caps.exposureMode||caps.exposureMode.indexOf("manual")<0){toast("This phone's browser cannot lock exposure.");return;}
  const next=!S.lock;
  try{await tr.applyConstraints({advanced:[{exposureMode:next?"manual":"continuous"}]});S.lock=next;paint();}
  catch(e){toast("This phone's browser cannot lock exposure.");}
};
function hold(btn,dir){
  const on=e=>{e.preventDefault();zoomDir=dir;$("zoomRead").classList.remove("off");try{btn.setPointerCapture(e.pointerId);}catch(x){}};
  const off=()=>{if(zoomDir===dir){zoomDir=0;setTimeout(()=>{if(!zoomDir)$("zoomRead").classList.add("off");},900);}};
  btn.addEventListener("pointerdown",on);
  for(const ev of ["pointerup","pointercancel","lostpointercapture"]) btn.addEventListener(ev,off);
  btn.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat){zoomDir=dir;$("zoomRead").classList.remove("off");}});
  btn.addEventListener("keyup",off);btn.addEventListener("blur",off);
  btn.addEventListener("contextmenu",e=>e.preventDefault());
}
hold($("zoomW"),-1);hold($("zoomT"),1);

$("settingsBtn").onclick=()=>{closeDrawer();$("settings").hidden=false;$("settingsClose").focus();};
$("settingsClose").onclick=()=>{$("settings").hidden=true;$("settingsBtn").focus();};
$("galleryBtn").onclick=()=>{closeDrawer();$("gallery").hidden=false;$("galleryClose").focus();};
$("galleryClose").onclick=()=>{for(const v of $("clips").querySelectorAll("video")) v.pause();$("gallery").hidden=true;$("galleryBtn").focus();};
$("facingSeg").onclick=e=>{
  const v=e.target.dataset&&e.target.dataset.v;if(!v||v===S.facing) return;
  S.facing=v;remember();paint();
  $("shootInput").setAttribute("capture",v);
  if(mode==="live"&&!recording) startLive(false);
};
$("overSwitch").onclick=()=>{if(recording){toast("Stop recording to change this.");return;}S.overscan=!S.overscan;remember();paint();};
$("burnSwitch").onclick=()=>{S.burn=!S.burn;remember();paint();};
$("sideSeg").onclick=e=>{
  const v=e.target.dataset&&e.target.dataset.v;if(v===undefined||S.format==="vhs") return;
  if(recording){toast("Stop recording to change this.");return;}
  S.side=+v;if(!S.overscan) S.overscan=true;remember();paint();
};
$("filterRange").oninput=e=>{S.filter=+e.target.value;remember();paint();};
$("speedRange").oninput=e=>{S.zoomSpeed=+e.target.value;remember();paint();};
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(!$("settings").hidden) $("settingsClose").click();
  else if(!$("gallery").hidden) $("galleryClose").click();
  else closeDrawer();
});

/* ---------- start ---------- */
$("shootInput").setAttribute("capture",S.facing);
buildStocks();paint();renderClips();
glOK=initGL();
if(!glOK) toast("This browser cannot draw the film look (WebGL is off).",6000);
requestAnimationFrame(tick);
if(FRAMED) showCard(false);
else startLive(true).then(ok=>{if(!ok&&mode==="test") showCard(false);});
window.__reel8={S,dyn,FILM_STOCKS,FORMATS,FILTERS,dustSheet(){return dustCanvas?dustCanvas.toDataURL("image/png"):null;},get mode(){return mode;},get frames(){return frames;},clips,loadClip,paint,buildStocks,
  still(el){stillEl=el;mode="still";$("srcCard").hidden=true;},snap(){return new Promise(r=>{snapCb=r;});}};
})();
</script>
</body>
